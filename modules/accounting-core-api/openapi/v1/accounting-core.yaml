openapi: 3.1.0
info:
  title: Accounting Core API
  version: 1.0.0
  description: Versioned transport contract for the Accounting Core module.
servers:
  - url: /api/v1/accounting/accounting-core
paths:
  /legal-entities:
    get:
      operationId: accounting.core.legalEntities.list
      security:
        - sanctum: [accounting.core.read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/LegalEntityCollection'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: accounting.core.legalEntities.create
      security:
        - sanctum: [accounting.core.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalEntityInput'
      responses:
        '201':
          $ref: '#/components/responses/LegalEntity'
        '422':
          $ref: '#/components/responses/Problem'
  /legal-entities/{id}:
    get:
      operationId: accounting.core.legalEntities.get
      security:
        - sanctum: [accounting.core.read]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/LegalEntity'
        '404':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]+$'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    LegalEntity:
      type: object
      required: [id, type, attributes]
      properties:
        id:
          type: string
        type:
          type: string
          const: accounting-legal-entity
        attributes:
          $ref: '#/components/schemas/LegalEntityInput'
    LegalEntityInput:
      type: object
      required: [name, currency_code]
      properties:
        name:
          type: string
          maxLength: 255
        registration_number:
          type: [string, 'null']
          maxLength: 255
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
        accounting_basis:
          type: string
          enum: [accrual, cash]
        is_active:
          type: boolean
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
  responses:
    LegalEntity:
      description: An authorized legal entity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegalEntity'
    LegalEntityCollection:
      description: Authorized legal entities.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/LegalEntity'
              meta:
                $ref: '#/components/schemas/Pagination'
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
